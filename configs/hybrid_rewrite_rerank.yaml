name: hybrid_rewrite_rerank
retriever:
  mode: hybrid
  dense_model: sentence-transformers/all-MiniLM-L6-v2
  rrf_k: 60
  top_k: 20
rewriter:
  enabled: true
  strategy: multi_query
reranker:
  enabled: true
  model: BAAI/bge-reranker-v2-m3
  top_n: 5
generator:
  model: claude-sonnet-4-6
  max_tokens: 512
