name: hybrid_rewrite_rerank
retriever:
  mode: hybrid
  dense_model: sentence-transformers/all-MiniLM-L6-v2
  rrf_k: 60
  top_k: 20
rewriter:
  enabled: true
  strategy: multi_query
reranker:
  enabled: true
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_n: 5
generator:
  model: qwen2.5-coder:7b
  max_tokens: 512
